<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  {{metadata}}
  <link rel="stylesheet" href="/assets/catalog.css?v=1">
  <link rel="stylesheet" href="/assets/chrome.css?v=2">
  <script src="/assets/stories.js?v=1" defer></script>
  <script src="/assets/site.js?v=5" defer></script>
  <script src="/assets/catalog.js?v=1" defer></script>
</head>
<body data-page="catalog" data-category="{{id}}">
  <header class="site-header"></header>
  <main class="catalog">
    <nav class="breadcrumbs" aria-label="パンくず">
      <a href="/">トップ</a><span aria-hidden="true">›</span>{{breadcrumbs}}
    </nav>
    <div class="listing-intro">
      <h1>{{title}}</h1>
      <div class="filters" id="filters" role="navigation" aria-label="カテゴリ一覧"></div>
    </div>
    <div class="catalog-columns">
      <section aria-labelledby="results-heading">
        <div class="results-bar">
          <div><h2 id="results-heading">新着記事</h2><p id="count" role="status"></p></div>
          <div class="search"><label class="sr-only" for="query">記事を検索</label><input id="query" type="search" placeholder="アプリ名で検索"></div>
        </div>
        <div id="results"></div>
        <nav id="pagination" class="pagination" aria-label="記事一覧のページ送り" hidden></nav>
      </section>
      <aside class="sidebar" aria-label="運営者情報">
        <section class="profile" aria-labelledby="profile-title">
          <h2 id="profile-title">著者プロフィール</h2>
          <img class="avatar" src="/icon.png" alt="" width="76" height="76">
          <p class="author">ポイモル</p>
          <p class="tagline">ポイ活 × 投資で<br>手出し0円でモルディブを目指す男</p>
          <p class="bio">ポイ活歴4年以上。実際に使ったアプリのデータを正直に公開し、YouTubeやブログで発信中。</p>
          <nav class="profile-social" aria-label="ポイモルのSNS">
            <a href="https://www.youtube.com/@poimoru"><img src="/assets/youtube-logo.png" alt="">YouTube</a>
          </nav>
        </section>
        <section class="meter" aria-labelledby="meter-title">
          <div class="meter-row"><h2 id="meter-title">モルディブメーター</h2><strong id="meter-pct">--%</strong></div>
          <progress id="catalog-meter" max="100" aria-label="モルディブ旅行資金の進捗"></progress>
          <p id="meter-note">進捗を読み込み中</p>
        </section>
      </aside>
    </div>
  </main>
  <footer class="site-footer"></footer>
</body>
</html>
